[tool.poetry]
name = "xrdanalysis"
version = "0.1.0"
description = "XRD analysis and EOSDX d2xc hardware control"
authors = ["EOSDX <devnull@example.com>"]
readme = "README.md"
packages = [
  { include = "xrdanalysis", from = "src" },
  { include = "hardware", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.7.1,<3.8"
# Core scientific stack (compatible with Python 3.7)
numpy = "1.21.6"
scipy = "1.7.3"
pandas = "1.3.5"
matplotlib = "3.5.3"
seaborn = "0.11.2"
joblib = "1.2.0"
h5py = "3.7.0"
# Imaging and machine learning
scikit-image = "0.19.3"
scikit-learn = "1.0.2"
# XRD specific
pyFAI = "0.21.3"
# Optimization / ML frameworks (versions supporting 3.7)
lightgbm = "3.3.2"
xgboost = "1.6.2"
shap = "0.40.0"
umap-learn = "0.5.3"
# Utilities (requests for download.py)
requests = "*"
# UI for d2xc
PyQt5 = "5.15.7"
# OpenCV (limit to a version with wheels for 3.7)
opencv-python = "4.5.5.64"
# Optional experiment tracking and tuning (pinned for 3.7)
mlflow = "1.29.0"
optuna = "2.10.1"
click = "8.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "6.2.5"
black = "21.12b0"
flake8 = "4.0.1"
isort = "5.10.1"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
