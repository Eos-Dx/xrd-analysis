[tool.poetry]
name = "xrdanalysis"
version = "0.1.0"
description = "XRD analysis and EOSDX d2xc hardware control"
authors = ["EOSDX <devnull@example.com>"]
readme = "README.md"
packages = [
  { include = "xrdanalysis", from = "src" },
  { include = "hardware", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
# Core scientific stack (modern versions for Python 3.11)
numpy = "1.26.4"
scipy = "1.13.0"
pandas = "2.2.2"
matplotlib = "3.8.4"
seaborn = "0.13.2"
joblib = "*"
h5py = "3.11.0"
# Imaging and machine learning
scikit-image = "0.22.0"
scikit-learn = "1.5.0"
# XRD specific
pyFAI = "2024.5.0"
# Optimization / ML frameworks (modern versions)
lightgbm = "*"
xgboost = "2.0.3"
shap = "0.45.1"
umap-learn = "0.5.7"
# Utilities
requests = "*"
# UI for d2xc
PyQt5 = "*"
# OpenCV
opencv-python = "*"
# Experiment tracking and tuning
mlflow = "2.13.0"
optuna = "*"
click = "8.1.7"
# Additional modern packages
hydra-core = "1.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.2.1"
black = "24.4.2"
flake8 = "7.0.0"
isort = "5.13.2"
pre-commit = "3.7.1"
coverage = "7.5.1"
interrogate = "1.7.0"
numpydoc = "1.7.0"
sphinx = "7.3.7"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
