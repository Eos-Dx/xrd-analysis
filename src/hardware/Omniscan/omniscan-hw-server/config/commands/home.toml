command_id = "home"
description = "Home XY stage to reference position (required before precision movements)"
service = "Motion"
audit_level = "High"
risk_level = "Medium"

[safety_requirements]
allowed_states = ["Idle", "Calibrated", "Locked"]
requires_enable_button = false
requires_calibration = false
requires_key_switch = true
max_execution_time_seconds = 120

[[safety_requirements.interlock_checks]]
name = "emergency_stop"
required_value = false
error_message = "Emergency stop is pressed - motion disabled"

[execution]
rollback_on_failure = false

[[execution.steps]]
type = "LogAudit"
event_type = "motion_homing"
message = "Homing sequence initiated"

[[execution.steps]]
type = "CallDevice"
device = "motion"
method = "home"
parameters = []

[[execution.steps]]
type = "WaitForCondition"
condition = "motion_idle"
timeout_ms = 120000
poll_interval_ms = 500

[[execution.steps]]
type = "LogAudit"
event_type = "motion_homing_completed"
message = "Homing sequence completed successfully"

[[execution.steps]]
type = "NotifyStateChange"
component = "motion"
change_type = "homing_complete"

[[execution.error_cleanup]]
type = "CallDevice"
device = "motion"
method = "stop"
parameters = []
