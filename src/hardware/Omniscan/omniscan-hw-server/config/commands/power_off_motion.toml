command_id = "power_off_motion"
description = "Safely power down motion controller"
service = "DeviceInitialization"
audit_level = "High"
risk_level = "Low"

[safety_requirements]
allowed_states = ["Idle"]
requires_enable_button = false
requires_calibration = false
requires_key_switch = true
max_execution_time_seconds = 30

[execution]
rollback_on_failure = false

[[execution.steps]]
type = "LogAudit"
event_type = "motion_power_off"
message = "Motion controller power off requested"

[[execution.steps]]
type = "CallDevice"
device = "motion"
method = "power_off"
parameters = []

[[execution.steps]]
type = "NotifyStateChange"
component = "motion"
change_type = "powered_off"
