[pytest]
# Omniscan Orchestrator Test Configuration
# Medical Device Software - FDA Compliant Testing
# Per VER_OMNI-SERVER_001: ≥80% code coverage required

testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum coverage requirement per FDA
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=src/omniscan_orchestrator
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    --no-cov-on-fail
    -ra

# Test markers for organization
markers =
    unit: Unit tests for individual modules (fast)
    integration: Integration tests across modules (medium)
    system: System-level end-to-end tests (slow)
    safety: Safety-critical tests per UR-SAFE-001
    audit: Audit trail tests per UR-AUDIT-001
    data_integrity: Data integrity tests per UR-DATA-001, UR-DATA-002
    calibration: Calibration workflow tests per UR-CAL-001
    rbac: Role-based access control tests per UR-USER-002
    slow: Slow-running tests
    requires_grpc: Tests requiring gRPC server connection

# Filter warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
