text: 'The system shall define roles: OPERATOR (measurement/calibration), SENIOR (audit access), MAINTENANCE (full diagnostics), ADMIN (config/users). Enforce permissions at gRPC endpoint level. Store user credentials hashed (Argon2id) in encrypted database. Require key switch for MAINTENANCE role activation.'
